openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: QuoteCraft API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: templates
    description: Quote template management
  - name: parse
    description: Natural language parsing
  - name: openai
    description: OpenAI AI chat, image, and audio operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /templates:
    get:
      operationId: listTemplates
      tags: [templates]
      summary: List all saved quote templates
      responses:
        "200":
          description: List of templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuoteTemplate"
    post:
      operationId: createTemplate
      tags: [templates]
      summary: Save a new quote template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteTemplateInput"
      responses:
        "201":
          description: Created template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteTemplate"

  /templates/{id}:
    get:
      operationId: getTemplate
      tags: [templates]
      summary: Get a single quote template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Quote template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteTemplate"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: updateTemplate
      tags: [templates]
      summary: Update a quote template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteTemplateInput"
      responses:
        "200":
          description: Updated template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteTemplate"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteTemplate
      tags: [templates]
      summary: Delete a quote template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /parse-quote:
    post:
      operationId: parseQuoteDescription
      tags: [parse]
      summary: Parse a natural language business description into quote fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParseQuoteInput"
      responses:
        "200":
          description: Parsed quote form structure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParsedQuote"

  /apply-voice-command:
    post:
      operationId: applyVoiceCommand
      tags: [parse]
      summary: Apply a spoken command to an existing quote structure
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoiceCommandInput"
      responses:
        "200":
          description: Updated quote structure with a summary of the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceCommandResult"

  /openai/conversations:
    get:
      operationId: listOpenaiConversations
      tags: [openai]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiConversation"
    post:
      operationId: createOpenaiConversation
      tags: [openai]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversation"

  /openai/conversations/{id}:
    get:
      operationId: getOpenaiConversation
      tags: [openai]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
    delete:
      operationId: deleteOpenaiConversation
      tags: [openai]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"

  /openai/conversations/{id}/messages:
    get:
      operationId: listOpenaiMessages
      tags: [openai]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiMessage"
    post:
      operationId: sendOpenaiMessage
      tags: [openai]
      summary: Send a text message and receive a streaming text response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiMessageInput"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}

  /openai/generate-image:
    post:
      operationId: generateOpenaiImage
      tags: [openai]
      summary: Generate an image from a text prompt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiImageInput"
      responses:
        "200":
          description: Generated image data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiImageOutput"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    QuoteLineItem:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        description:
          type: ["string", "null"]
        unit:
          type: string
        unitPrice:
          type: number
        quantity:
          type: number
        voiceKey:
          type: string
          description: Voice command keyword to set this field quantity
      required:
        - id
        - label
        - unit
        - unitPrice
        - quantity
        - voiceKey

    QuoteSettings:
      type: object
      properties:
        includeGst:
          type: boolean
        gstRate:
          type: number
        callOutFee:
          type: number
        publicHolidaySurchargePercent:
          type: number
        isPublicHoliday:
          type: boolean
        hasCallOut:
          type: boolean
      required:
        - includeGst
        - gstRate
        - callOutFee
        - publicHolidaySurchargePercent
        - isPublicHoliday
        - hasCallOut

    QuoteTemplate:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        businessDescription:
          type: string
        lineItems:
          type: array
          items:
            $ref: "#/components/schemas/QuoteLineItem"
        settings:
          $ref: "#/components/schemas/QuoteSettings"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - businessDescription
        - lineItems
        - settings
        - createdAt
        - updatedAt

    QuoteTemplateInput:
      type: object
      properties:
        name:
          type: string
        businessDescription:
          type: string
        lineItems:
          type: array
          items:
            $ref: "#/components/schemas/QuoteLineItem"
        settings:
          $ref: "#/components/schemas/QuoteSettings"
      required:
        - name
        - businessDescription
        - lineItems
        - settings

    ParseQuoteInput:
      type: object
      properties:
        description:
          type: string
          description: Natural language description of the business and pricing
      required:
        - description

    ParsedQuote:
      type: object
      properties:
        businessName:
          type: ["string", "null"]
        lineItems:
          type: array
          items:
            $ref: "#/components/schemas/QuoteLineItem"
        settings:
          $ref: "#/components/schemas/QuoteSettings"
      required:
        - lineItems
        - settings

    VoiceCommandInput:
      type: object
      properties:
        command:
          type: string
          description: The spoken command transcript to apply to the quote
        lineItems:
          type: array
          items:
            $ref: "#/components/schemas/QuoteLineItem"
        settings:
          $ref: "#/components/schemas/QuoteSettings"
      required:
        - command
        - lineItems
        - settings

    VoiceCommandResult:
      type: object
      properties:
        lineItems:
          type: array
          items:
            $ref: "#/components/schemas/QuoteLineItem"
        settings:
          $ref: "#/components/schemas/QuoteSettings"
        message:
          type: string
          description: Short human-readable summary of what changed
        understood:
          type: boolean
          description: Whether the command was understood and applied
      required:
        - lineItems
        - settings
        - message
        - understood

    OpenaiConversation:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - createdAt

    OpenaiMessage:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - conversationId
        - role
        - content
        - createdAt

    OpenaiConversationInput:
      type: object
      properties:
        title:
          type: string
      required:
        - title

    OpenaiMessageInput:
      type: object
      properties:
        content:
          type: string
      required:
        - content

    OpenaiConversationWithMessages:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/OpenaiMessage"
      required:
        - id
        - title
        - createdAt
        - messages

    OpenaiImageInput:
      type: object
      properties:
        prompt:
          type: string
        size:
          type: string
          enum: ["1024x1024", "512x512", "256x256"]
      required:
        - prompt

    OpenaiImageOutput:
      type: object
      properties:
        b64_json:
          type: string
      required:
        - b64_json

    OpenaiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
